[package]
name = "claude-for-linux"
version = "0.1.0"
description = "Unofficial Community Desktop Client for Claude on Linux"
authors = ["Community Contributors"]
license = "MIT"
repository = "https://github.com/edward-playground/claude-desktop-linux"
edition = "2021"
rust-version = "1.75"

[lib]
name = "claude_for_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-os = "2"
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# Keyring (Linux secret service)
keyring = { version = "3", features = ["linux-native"] }

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
reqwest-eventsource = "0.6"
futures = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# Crypto for local encryption
ring = "0.17"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies
# secret-service is pulled in by keyring with linux-native feature

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
